# Local development configuration for CAATSM Dashboard
# This file uses localhost addresses for services running in Docker Compose

environment = "development"

[server]
host = "0.0.0.0"
port = 3002
read_timeout = "15s"
write_timeout = "30s"
idle_timeout = "120s"
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""

[logger]
level = "debug"
format = "console"
enable_stacktrace = true

[database]
dsn = "postgres://caatsm:caatsm@localhost:5432/caatsm?sslmode=disable"
max_open_connections = 25
max_idle_connections = 10
connection_max_lifetime = "30m"

[meilisearch]
host = "http://localhost:7700"
api_key = "masterKey"
index = "telegrams"

[redis]
addr = "localhost:6379"
username = ""
password = ""
db = 0
tls = false
timeout = "5s"

[nats]
url = "nats://localhost:4222"
stream = "telegrams"
consumer = "dashboard-sync"
connect_timeout = "5s"

[metrics]
enabled = true
path = "/metrics"

[auth]
enable_basic = false
username = ""
password = ""
jwt_secret = "dev-secret-change-in-production"

[websocket]
allowed_origins = ["http://localhost:3000", "http://localhost:5173"]
