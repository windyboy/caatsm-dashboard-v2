# Default configuration for CAATSM Dashboard

environment = "development"

[server]
host = "0.0.0.0"
port = 3002
read_timeout = "15s"
write_timeout = "30s"
idle_timeout = "120s"
tls_enabled = false
tls_cert_file = ""
tls_key_file = ""

[logger]
level = "debug"
format = "console"
enable_stacktrace = false

[database]
dsn = "postgres://caatsm:caatsm@postgres:5432/caatsm?sslmode=disable"
max_open_connections = 25
max_idle_connections = 10
connection_max_lifetime = "30m"

[meilisearch]
host = "http://meilisearch:7700"
api_key = "masterKey"
index = "telegrams"

[redis]
addr = "redis:6379"
username = ""
password = ""
db = 0
tls = false
timeout = "5s"

[nats]
url = "nats://nats:4222"
stream = "telegrams"
consumer = "dashboard-sync"
connect_timeout = "5s"

[metrics]
enabled = false
path = "/metrics"

[auth]
enable_basic = false
username = ""
password = ""
jwt_secret = ""

[tracing]
enabled = false
service_name = "caatsm-dashboard"
otlp_endpoint = "localhost:4318"
sampling_ratio = 1.0

[websocket]
allowed_origins = ["http://localhost:3000", "http://localhost:5173"]
