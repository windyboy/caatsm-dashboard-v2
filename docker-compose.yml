# version: "3.9"

services:
  app:
    build: .
    ports:
      - "3002:3002"
    env_file:
      - env.example
    volumes:
      - ./config/config.toml:/app/config/config.toml:ro
      - ./public:/app/public
    depends_on:
      - postgres
      - meilisearch
      - nats
      - redis

  sync:
    build: .
    command: ["./caatsm", "-config", "/app/config/config.toml", "sync"]
    env_file:
      - env.example
    volumes:
      - ./config/config.toml:/app/config/config.toml:ro
    depends_on:
      - postgres
      - meilisearch
      - nats
      - redis
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.16.0-pg15
    environment:
      POSTGRES_DB: caatsm
      POSTGRES_USER: caatsm
      POSTGRES_PASSWORD: caatsm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: masterKey
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  nats:
    image: nats:2.12.2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pg_data:
  meili_data:
  grafana_data:

