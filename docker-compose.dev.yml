# Development Docker Compose Configuration
# 
# This file defines the development dependencies for CAATSM Dashboard:
# - PostgreSQL 15+ with TimescaleDB extension
# - Meilisearch 1.5+ for full-text search
# - NATS 2.12.2 with JetStream for message ingestion
# - Valkey 9 (Redis-compatible) for caching, pub/sub, and streams
#
# Usage:
#   make dev-up          # Start all services
#   make dev-down        # Stop all services
#   make dev-logs        # View logs
#
# Configuration:
#   - Services read from .env.local if it exists
#   - Default credentials are safe for development only
#   - All services are on the 'backend' network

version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:2.23.0-pg16
    container_name: caatsm-postgres-dev
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caatsm}
      POSTGRES_USER: ${POSTGRES_USER:-caatsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caatsm}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caatsm} -d ${POSTGRES_DB:-caatsm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 256mb
    networks:
      - backend
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=200

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: caatsm-meilisearch-dev
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-DEBUG}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meili_data_dev:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  nats:
    # NATS 2.12.2-alpine: Before deploying to production, validate in staging:
    # JetStream metadata backup, buffer limit checks (128MB/10k messages),
    # exit code compatibility, and stream state validation.
    image: nats:2.12.2-alpine
    container_name: caatsm-nats-dev
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-sd"
      - "/data"
    ports:
      - "${NATS_PORT:-4222}:4222"      # Client connections
      - "${NATS_HTTP_PORT:-8222}:8222"  # Monitoring/HTTP
    volumes:
      - nats_data_dev:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  redis:
    image: valkey/valkey:9-alpine
    container_name: caatsm-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

volumes:
  pg_data_dev:
    driver: local
  meili_data_dev:
    driver: local
  nats_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  backend:
    driver: bridge
    name: caatsm-backend-dev

