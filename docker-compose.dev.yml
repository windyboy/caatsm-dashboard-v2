# version: "3.9"

# Load .env.local if it exists, otherwise fall back to .env
# Docker Compose and Podman Compose will automatically read .env file
# For .env.local, we need to explicitly reference it in environment variables
# or use env_file in services (but that's per-service, not global)

services:
  postgres:
    image: timescale/timescaledb:2.23.0-pg16
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: caatsm
      POSTGRES_USER: caatsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caatsm}
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caatsm"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-DEBUG}
    ports:
      - "7700:7700"
    volumes:
      - meili_data_dev:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data_dev:/data
    networks:
      - backend

  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

volumes:
  pg_data_dev:
  meili_data_dev:
  nats_data_dev:
  redis_data_dev:

networks:
  backend:
    driver: bridge

