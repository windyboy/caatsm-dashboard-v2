<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CAATSM Dashboard for real-time telegram monitoring and search"
    />
    <meta name="theme-color" content="#3b82f6" />
    <title>CAATSM Dashboard</title>
    <script>
      // Apply theme synchronously before first render to prevent flash
      (function() {
        const theme = localStorage.getItem('caatsm-theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
