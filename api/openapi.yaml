openapi: 3.1.0
info:
  title: CAATSM Dashboard API
  version: 1.0.0
  description: |
    Civil Aviation Aerogram Traffic Stream Monitor Dashboard API provides realtime monitoring,
    search, and analytics for aviation telegram traffic across AFTN, SITA, ACARS, and CPDLC networks.

    ## Architecture Overview

    The API follows Clean Architecture with four layers:
    - **Delivery Layer**: HTTP/WebSocket handlers with request parsing and validation
    - **Application Layer**: Business logic orchestration and service coordination
    - **Domain Layer**: Business rules, entities, and validation (e.g., max 90-day time ranges)
    - **Infrastructure Layer**: Direct implementation of data persistence and external services

    ## Data Flow: HTTP Request to Database

    ```
    HTTP Request
        ↓
    Delivery Layer (HTTP Handler)
        ↓ Parse request, validate input, apply rate limiting (10 req/sec)
    Application Layer (DashboardService)
        ↓ Orchestrate business logic, parallel data fetching
    Domain Layer (Business Entities)
        ↓ Apply business rules (time range limits, filtering)
    Infrastructure Layer (Repository)
        ↓ Execute queries against PostgreSQL + Meilisearch
    Database/Cache/External Systems
    ```

    ## WebSocket Real-time Streaming

    WebSocket connections provide real-time updates with automatic backpressure control:

    ```
    WebSocket Connection (ws://host:port/ws)
        ↓
    Infrastructure Layer (WebSocket Hub)
        ↓ Connection management, slow client detection
    Application Layer (Realtime Service)
        ↓ Broadcast stats updates and new messages
    Client receives JSON messages:
    - { "type": "message", "data": {...} }
    - { "type": "stats", "data": { "total": 1234, "byType": {...}, "activeRoutes": 156, "messagesPerSec": 12.5, "timeWindow": "last_1h" } }
    ```

    **Important - WebSocket Guarantees**:
    
    WebSocket messages are **best-effort** and not guaranteed. Clients should:
    - Treat messages as hints for UI updates
    - Periodically poll `GET /api/search` for reconciliation
    - Re-fetch full state after reconnection (no replay buffer maintained)
    - Handle connection drops gracefully with exponential backoff
    - Implement client-side timeouts and reconnection logic

    ## Component Interactions

    - **PostgreSQL**: Primary data storage with TimescaleDB for time-series optimization
    - **Meilisearch**: Full-text search with typo tolerance
    - **Valkey/Redis**: Caching layer for performance optimization
    - **NATS JetStream**: Message ingestion and event streaming
    - **WebSocket Hub**: Real-time client connections with connection limits (5/IP, 10k global)

    ## Security Mechanisms

    - **Rate Limiting**: 10 requests/second per IP address (configurable)
    - **Input Validation**: Whitelist-based filtering, SQL injection prevention
    - **Time Range Limits**: Maximum 90 days to prevent unbounded queries
    - **Authentication**: Basic Auth (configurable) with JWT support planned
    - **Production Guards**: TLS enforcement, localhost restrictions in production

    Features:
    - Full-text search with Meilisearch
    - Real-time analytics and statistics
    - Time range validation (max 90 days)
    - WebSocket real-time updates
    - Production-ready with rate limiting and security
  contact:
    name: API Support
    email: support@caatsm.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3002/api
    description: Development server
  - url: https://api.caatsm.example.com/api
    description: Production server

tags:
  - name: search
    description: Search operations
  - name: stats
    description: Statistics and analytics
  - name: health
    description: Health check endpoints
  - name: admin
    description: Admin operations
  - name: websocket
    description: WebSocket real-time streaming endpoints

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with configurable credentials.
        Enabled when `auth.enable_basic = true` in configuration.
        Username and password must be set in config for authentication to work.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication (planned for future implementation).
        Tokens will be issued via separate authentication endpoint.
        Currently configured with `auth.jwt_secret` for token signing.
    
  schemas:
    Telegram:
      type: object
      properties:
        message_id:
          type: string
          description: Unique message identifier
          example: "MSG-20241126-001"
        type:
          type: string
          enum: [AFTN, SITA, ACARS, CPDLC]
          description: Telegram message type
          example: "AFTN"
        time:
          type: string
          format: date-time
          description: Telegram timestamp (RFC3339)
          example: "2024-11-26T10:00:00Z"
        flight_number:
          type: string
          description: Associated flight number
          example: "CA1234"
        source:
          type: string
          description: Source airport (ICAO code)
          pattern: ^[A-Z]{4}$
          example: "ZBAA"
        destination:
          type: string
          description: Destination airport (ICAO code)
          pattern: ^[A-Z]{4}$
          example: "ZSPD"
        priority:
          type: integer
          minimum: 1
          maximum: 3
          description: Message priority level
          example: 2
        content:
          type: string
          description: Telegram message content
          example: "Flight information update"
        raw_data:
          type: string
          description: Raw telegram data
          example: "RAW AFTN MESSAGE DATA"
    
    SearchResult:
      type: object
      properties:
        telegrams:
          type: array
          items:
            $ref: '#/components/schemas/Telegram'
        total:
          type: integer
          description: Total number of matching telegrams
          example: 1500
        page:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page
          minimum: 1
          maximum: 1000
          default: 50
        offset:
          type: integer
          description: Number of results to skip
          minimum: 0
          maximum: 100000
          default: 0
        sort_by:
          type: string
          enum: [time, priority, message_id, type, flight_number, source, destination]
          default: time
        order:
          type: string
          enum: [asc, desc]
          default: desc

    TimeWindow:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
          description: Start time of the time window
        end_time:
          type: string
          format: date-time
          description: End time of the time window
    
    TrafficSummary:
      type: object
      properties:
        total:
          type: integer
          description: Total number of telegrams
          example: 15000
        byType:
          type: object
          additionalProperties:
            type: integer
          description: Message count by type (AFTN, SITA, ACARS, CPDLC)
          example:
            AFTN: 5000
            SITA: 8000
        activeRoutes:
          type: integer
          description: Number of unique source→destination route pairs
          example: 156
        messagesPerSec:
          type: number
          format: float
          description: Current message rate (messages per second, based on last 1 minute)
          example: 12.5
        timeWindow:
          type: string
          description: Time window identifier (last_1h, last_24h, all_time)
          example: last_1h
            "3": 2000
        byType:
          type: object
          additionalProperties:
            type: integer
          description: Message count by telegram type
          example:
            "AFTN": 10000
            "SITA": 3000
            "ACARS": 1500
            "CPDLC": 500
    
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Service health status
        service:
          type: string
          description: Service name
          example: "dashboard"
    

    WebSocketMessage:
      type: object
      description: |
        WebSocket message format for real-time updates.
        Messages are JSON objects with a type field indicating the message category.
      properties:
        type:
          type: string
          enum: [message, stats, pong]
          description: Message type identifier
        data:
          oneOf:
            - $ref: '#/components/schemas/Telegram'
            - $ref: '#/components/schemas/TrafficSummary'
            - type: string
              enum: [null]
              description: Empty data for pong messages
      required:
        - type
      example:
        type: "message"
        data:
          message_id: "MSG-20241126-001"
          type: "AFTN"
          time: "2024-11-26T10:00:00Z"
          flight_number: "CA1234"
          source: "ZBAA"
          destination: "ZSPD"
          priority: 2
          content: "Flight information update"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "invalid parameters"

paths:
  /search:
    get:
      summary: Search telegrams
      description: |
        Search aviation telegrams with full-text search and filters.

        **Data Flow:**
        1. Request parsed and validated at Delivery layer
        2. Rate limiting applied (10 req/sec per IP)
        3. Application layer orchestrates parallel queries to PostgreSQL + Meilisearch
        4. Domain layer validates time range (max 90 days) and applies business rules
        5. Infrastructure layer executes optimized queries with caching

        **Security & Validation:**
        - Input sanitization and SQL injection prevention
        - Time range validation (max 90 days from start_time)
        - Query length limit (500 characters)
        - Pagination limits (max 1000 results per page)
        - Sort field whitelist validation

        **Performance Features:**
        - Parallel execution of database and search queries
        - Valkey caching for frequently accessed results
        - Meilisearch typo-tolerant full-text search
        - TimescaleDB optimization for time-series data
      tags:
        - search
      parameters:
        - name: query
          in: query
          description: Search query text (max 500 characters)
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [time, priority, message_id, type, flight_number, source, destination]
            default: time
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: type
          in: query
          description: Filter by telegram type
          schema:
            type: string
            enum: [AFTN, SITA, ACARS, CPDLC]
        - name: source
          in: query
          description: Filter by source airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: destination
          in: query
          description: Filter by destination airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: start_time
          in: query
          description: Filter start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter end time (RFC3339 format, max 90 days from start_time)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Bad request (invalid parameters, time range > 90 days, query too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stats:
    get:
      summary: Get telegram statistics
      description: Get all telegram statistics including total count, breakdown by priority, and breakdown by type
      tags:
        - stats
      responses:
        '200':
          description: Telegram statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /health:
    get:
      summary: Health check
      description: Check basic health status of the dashboard service
      tags:
        - health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /admin/reindex:
    post:
      summary: Trigger reindex operation
      description: |
        Admin endpoint to trigger reindexing of messages from PostgreSQL to Meilisearch.
        Requires date range parameters (from and to in YYYY-MM-DD format).
      tags:
        - admin
      parameters:
        - name: from
          in: query
          required: true
          description: Start date (YYYY-MM-DD format)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: End date (YYYY-MM-DD format)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reindex job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
        '400':
          description: Bad request (invalid date format or range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws:
    get:
      summary: WebSocket real-time updates
      description: |
        Establish WebSocket connection for real-time telegram updates and statistics.

        **Connection Details:**
        - Protocol: WebSocket (ws:// or wss://)
        - Message Format: JSON with type-based routing
        - Heartbeat: Ping/pong messages supported
        - Backpressure: Automatic disconnection of slow clients
        - Limits: 5 connections per IP, 10,000 global connections

        **Message Types:**
        - `message`: New telegram received
        - `stats`: Updated statistics (total, byType, activeRoutes, messagesPerSec, timeWindow)
        - `pong`: Heartbeat response

        **Example Message:**
        ```json
        {
          "type": "message",
          "data": {
            "message_id": "MSG-20241126-001",
            "type": "AFTN",
            "time": "2024-11-26T10:00:00Z",
            "content": "Flight information update"
          }
        }
        ```

        **Client Implementation:**
        - Handle automatic reconnection on disconnection
        - Implement exponential backoff for reconnection attempts
        - Monitor connection status for UI updates
      tags:
        - websocket
      responses:
        '101':
          description: WebSocket connection established
          # No content - this is a protocol switch to WebSocket
security:
 - BasicAuth: []

