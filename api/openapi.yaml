servers:
  - url: http://localhost:3002/api
    description: Development server
  - url: https://api.caatsm.example.com/api
    description: Production server

tags:
  - name: search
    description: Search and autocomplete operations
  - name: stats
    description: Statistics and analytics
  - name: export
    description: Data export operations
  - name: health
    description: Health check endpoints
  - name: websocket
    description: WebSocket real-time streaming endpoints

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication with configurable credentials.
        Enabled when `auth.enable_basic = true` in configuration.
        Username and password must be set in config for authentication to work.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication (planned for future implementation).
        Tokens will be issued via separate authentication endpoint.
        Currently configured with `auth.jwt_secret` for token signing.
    
  schemas:
    Telegram:
      type: object
      properties:
        message_id:
          type: string
          description: Unique message identifier
          example: "MSG-20241126-001"
        type:
          type: string
          enum: [AFTN, SITA, ACARS, CPDLC]
          description: Telegram message type
          example: "AFTN"
        time:
          type: string
          format: date-time
          description: Telegram timestamp (RFC3339)
          example: "2024-11-26T10:00:00Z"
        flight_number:
          type: string
          description: Associated flight number
          example: "CA1234"
        source:
          type: string
          description: Source airport (ICAO code)
          pattern: ^[A-Z]{4}$
          example: "ZBAA"
        destination:
          type: string
          description: Destination airport (ICAO code)
          pattern: ^[A-Z]{4}$
          example: "ZSPD"
        priority:
          type: integer
          minimum: 1
          maximum: 3
          description: Message priority level
          example: 2
        content:
          type: string
          description: Telegram message content
          example: "Flight information update"
        raw_data:
          type: string
          description: Raw telegram data
          example: "RAW AFTN MESSAGE DATA"
    
    SearchResult:
      type: object
      properties:
        telegrams:
          type: array
          items:
            $ref: '#/components/schemas/Telegram'
        total:
          type: integer
          description: Total number of matching telegrams
          example: 1500
        page:
          $ref: '#/components/schemas/Pagination'

    DashboardResponse:
      type: object
      properties:
        searchResults:
          $ref: '#/components/schemas/SearchResult'
        stats:
          $ref: '#/components/schemas/TrafficSummary'
        timeRange:
          $ref: '#/components/schemas/TimeWindow'
    
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          description: Number of results per page
          minimum: 1
          maximum: 1000
          default: 50
        offset:
          type: integer
          description: Number of results to skip
          minimum: 0
          maximum: 100000
          default: 0
        sort_by:
          type: string
          enum: [time, priority, message_id, type, flight_number, source, destination]
          default: time
        order:
          type: string
          enum: [asc, desc]
          default: desc

    TimeWindow:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
          description: Start time of the time window
        end_time:
          type: string
          format: date-time
          description: End time of the time window
    
    TrafficSummary:
      type: object
      properties:
        total:
          type: integer
          description: Total number of telegrams
          example: 15000
        byPriority:
          type: object
          additionalProperties:
            type: integer
          description: Message count by priority level (1-3)
          example:
            "1": 5000
            "2": 8000
            "3": 2000
        byType:
          type: object
          additionalProperties:
            type: integer
          description: Message count by telegram type
          example:
            "AFTN": 10000
            "SITA": 3000
            "ACARS": 1500
            "CPDLC": 500
    
    
    AutocompleteResult:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
          example: ["ZBAA", "ZSPD", "ZSSS"]
    
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Service health status
        service:
          type: string
          description: Service name
          example: "dashboard"
    

    WebSocketMessage:
      type: object
      description: |
        WebSocket message format for real-time updates.
        Messages are JSON objects with a type field indicating the message category.
      properties:
        type:
          type: string
          enum: [message, stats, pong]
          description: Message type identifier
        data:
          oneOf:
            - $ref: '#/components/schemas/Telegram'
            - $ref: '#/components/schemas/TrafficSummary'
            - type: string
              enum: [null]
              description: Empty data for pong messages
      required:
        - type
      example:
        type: "message"
        data:
          message_id: "MSG-20241126-001"
          type: "AFTN"
          time: "2024-11-26T10:00:00Z"
          flight_number: "CA1234"
          source: "ZBAA"
          destination: "ZSPD"
          priority: 2
          content: "Flight information update"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "invalid parameters"

paths:
  /dashboard:
    get:
      summary: Get unified dashboard data
      description: |
        Retrieve unified dashboard data including search results and statistics.

        **Data Flow:**
        1. Request parsed and validated at Delivery layer
        2. Rate limiting applied (10 req/sec per IP)
        3. Application layer orchestrates parallel queries to PostgreSQL + Meilisearch
        4. Domain layer validates time range and applies business rules
        5. Infrastructure layer executes optimized queries with caching

        **Security & Validation:**
        - Input sanitization and SQL injection prevention
        - Time range validation (max 90 days from start_time)
        - Query length limit (500 characters)
        - Pagination limits (max 1000 results per page)
        - Sort field whitelist validation
      tags:
        - search
        - stats
      parameters:
        - name: query
          in: query
          description: Search query text (max 500 characters)
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [time, priority, message_id, type, flight_number, source, destination]
            default: time
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: type
          in: query
          description: Filter by telegram type
          schema:
            type: string
            enum: [AFTN, SITA, ACARS, CPDLC]
        - name: source
          in: query
          description: Filter by source airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: destination
          in: query
          description: Filter by destination airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: start_time
          in: query
          description: Filter start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter end time (RFC3339 format, max 90 days from start_time)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: Bad request (invalid parameters, time range > 90 days, query too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /search:
    get:
      summary: Search telegrams
      description: |
        Search aviation telegrams with full-text search and filters.

        **Data Flow:**
        1. Request parsed and validated at Delivery layer
        2. Rate limiting applied (10 req/sec per IP)
        3. Application layer orchestrates parallel queries to PostgreSQL + Meilisearch
        4. Domain layer validates time range (max 90 days) and applies business rules
        5. Infrastructure layer executes optimized queries with caching

        **Security & Validation:**
        - Input sanitization and SQL injection prevention
        - Time range validation (max 90 days from start_time)
        - Query length limit (500 characters)
        - Pagination limits (max 1000 results per page)
        - Sort field whitelist validation

        **Performance Features:**
        - Parallel execution of database and search queries
        - Valkey caching for frequently accessed results
        - Meilisearch typo-tolerant full-text search
        - TimescaleDB optimization for time-series data
      tags:
        - search
      parameters:
        - name: query
          in: query
          description: Search query text (max 500 characters)
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [time, priority, message_id, type, flight_number, source, destination]
            default: time
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: type
          in: query
          description: Filter by telegram type
          schema:
            type: string
            enum: [AFTN, SITA, ACARS, CPDLC]
        - name: source
          in: query
          description: Filter by source airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: destination
          in: query
          description: Filter by destination airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: integer
            minimum: 1
            maximum: 3
        - name: start_time
          in: query
          description: Filter start time (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: Filter end time (RFC3339 format, max 90 days from start_time)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Bad request (invalid parameters, time range > 90 days, query too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Search telegrams with body parameters
      description: |
        Search aviation telegrams with full-text search and filters using request body.

        **Data Flow:**
        1. Request parsed and validated at Delivery layer
        2. Rate limiting applied (10 req/sec per IP)
        3. Application layer orchestrates parallel queries to PostgreSQL + Meilisearch
        4. Domain layer validates time range (max 90 days) and applies business rules
        5. Infrastructure layer executes optimized queries with caching

        **Security & Validation:**
        - Input sanitization and SQL injection prevention
        - Time range validation (max 90 days from start_time)
        - Query length limit (500 characters)
        - Pagination limits (max 1000 results per page)
        - Sort field whitelist validation

        **Performance Features:**
        - Parallel execution of database and search queries
        - Valkey caching for frequently accessed results
        - Meilisearch typo-tolerant full-text search
        - TimescaleDB optimization for time-series data
      tags:
        - search
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  maxLength: 500
                  description: Search query text (max 500 characters)
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 50
                  description: Number of results per page
                offset:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  default: 0
                  description: Pagination offset
                sort_by:
                  type: string
                  enum: [time, priority, message_id, type, flight_number, source, destination]
                  default: time
                  description: Sort field
                order:
                  type: string
                  enum: [asc, desc]
                  default: desc
                  description: Sort order
                type:
                  type: string
                  enum: [AFTN, SITA, ACARS, CPDLC]
                  description: Filter by telegram type
                source:
                  type: string
                  pattern: ^[A-Z]{4}$
                  description: Filter by source airport (ICAO code)
                destination:
                  type: string
                  pattern: ^[A-Z]{4}$
                  description: Filter by destination airport (ICAO code)
                priority:
                  type: integer
                  minimum: 1
                  maximum: 3
                  description: Filter by priority level
                start_time:
                  type: string
                  format: date-time
                  description: Filter start time (RFC3339 format)
                end_time:
                  type: string
                  format: date-time
                  description: Filter end time (RFC3339 format, max 90 days from start_time)
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Bad request (invalid parameters, time range > 90 days, query too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /autocomplete:
    get:
      summary: Get autocomplete suggestions
      description: Get search term suggestions for autocomplete functionality
      tags:
        - search
      parameters:
        - name: term
          in: query
          required: true
          description: Search term to get suggestions for
          schema:
            type: string
        - name: size
          in: query
          description: Number of suggestions to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResult'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /stats:
    get:
      summary: Get telegram statistics
      description: Get all telegram statistics including total count, breakdown by priority, and breakdown by type
      tags:
        - stats
      responses:
        '200':
          description: Telegram statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficSummary'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /export:
    get:
      summary: Export telegrams to CSV
      description: |
        Export search results to CSV format with streaming support.

        **Streaming Export Process:**
        1. Request validated and rate limited at Delivery layer
        2. Application layer initiates streaming query with chunking (1000 records/chunk)
        3. Infrastructure layer streams data from PostgreSQL without loading all records into memory
        4. Response streamed directly to client with proper Content-Type headers
        5. Automatic cleanup on client disconnection or completion

        **Memory Management:**
        - Chunked processing prevents OOM for large exports
        - Maximum 10,000 records per export (configurable)
        - Streaming response with Transfer-Encoding: chunked
        - Automatic resource cleanup on errors or disconnection

        **Security & Limits:**
        - Rate limiting (10 req/sec per IP)
        - Export size limits to prevent resource exhaustion
        - Input validation on all filter parameters
        - SQL injection prevention through parameterized queries

        **Supported Format:**
        - CSV: Plain text with proper escaping
      tags:
        - export
      parameters:
        - name: format
          in: query
          description: Export format (only CSV supported)
          schema:
            type: string
            enum: [csv]
            default: csv
        - name: query
          in: query
          description: Search query text
          schema:
            type: string
        - name: type
          in: query
          description: Filter by telegram type
          schema:
            type: string
            enum: [AFTN, SITA, ACARS, CPDLC]
        - name: source
          in: query
          description: Filter by source airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
        - name: destination
          in: query
          description: Filter by destination airport (ICAO code)
          schema:
            type: string
            pattern: ^[A-Z]{4}$
      responses:
        '200':
          description: Exported CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /health:
    get:
      summary: Health check
      description: Check basic health status of the dashboard service
      tags:
        - health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /ws:
    get:
      summary: WebSocket real-time updates
      description: |
        Establish WebSocket connection for real-time telegram updates and statistics.

        **Connection Details:**
        - Protocol: WebSocket (ws:// or wss://)
        - Message Format: JSON with type-based routing
        - Heartbeat: Ping/pong messages supported
        - Backpressure: Automatic disconnection of slow clients
        - Limits: 5 connections per IP, 10,000 global connections

        **Message Types:**
        - `message`: New telegram received
        - `stats`: Updated statistics (total, byPriority, byType)
        - `pong`: Heartbeat response

        **Example Message:**
        ```json
        {
          "type": "message",
          "data": {
            "message_id": "MSG-20241126-001",
            "type": "AFTN",
            "time": "2024-11-26T10:00:00Z",
            "content": "Flight information update"
          }
        }
        ```

        **Client Implementation:**
        - Handle automatic reconnection on disconnection
        - Implement exponential backoff for reconnection attempts
        - Monitor connection status for UI updates
      tags:
        - websocket
      responses:
        '101':
          description: WebSocket connection established
          # No content - this is a protocol switch to WebSocket
security:
 - BasicAuth: []

