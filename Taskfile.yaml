version: "3"

tasks:
  default:
    desc: "Build the application"
    cmds:
      - task: backend:build

  # Backend - Build
  backend:build:
    desc: "Build the API server binary"
    cmds:
      - go build -buildvcs=false -o bin/caatsm ./cmd/server

  # Backend - Testing
  backend:test:
    desc: "Run all Go tests with coverage"
    cmds:
      - go test -cover ./...

  backend:test:unit:
    desc: "Run unit tests only (short)"
    cmds:
      - go test -short ./...

  backend:test:integration:
    desc: "Run integration tests only"
    cmds:
      - go test -tags=integration ./...

  backend:test:race:
    desc: "Run tests with race detector"
    cmds:
      - go test -race ./...

  # Backend - Code Quality
  backend:lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  # Backend - Development
  backend:dev:
    desc: "Run backend with hot reload (air if available, else go run)"
    cmds:
      - |
        if command -v air >/dev/null 2>&1; then
          air
        else
          echo "air not found, running go run ./cmd/server"
          go run ./cmd/server -config ${CAATSM_CONFIG:-config/config.local.toml}
        fi

  backend:dev:run:
    desc: "Run backend server directly (no hot reload)"
    cmds:
      - go run ./cmd/server -config ${CAATSM_CONFIG:-config/config.local.toml}

  # Backend - Database
  backend:migrate:
    desc: "Run database migrations with goose"
    cmds:
      - goose -dir migrations postgres "${CAATSM_DATABASE_DSN:-postgres://caatsm:caatsm@localhost:5432/caatsm?sslmode=disable}" up

  # Backend - Utilities
  backend:generate-test-data:
    desc: "Generate sample telegram data (50 records)"
    cmds:
      - go run ./cmd/generate-test-data -count 50

  backend:publish-stream:
    desc: "Publish live messages to NATS"
    cmds:
      - go run ./cmd/publish-stream -config ${CAATSM_CONFIG:-config/config.local.toml} ${CLI_ARGS:-}

  backend:publish-stream:fast:
    desc: "Publish messages quickly (1/sec, 50 total)"
    cmds:
      - CLI_ARGS="-interval 1s -total 50" task backend:publish-stream

  backend:publish-stream:slow:
    desc: "Publish messages slowly (5 sec interval)"
    cmds:
      - CLI_ARGS="-interval 5s" task backend:publish-stream

  # Installation
  install:
    desc: "Install all dependencies (Go modules, Deno, frontend)"
    cmds:
      - echo "Installing Go dependencies..."
      - go mod download
      - go mod tidy
      - echo "Setting up frontend..."
      - task: frontend:setup

  install:deno:
    desc: "Install Deno if not available"
    cmds:
      - |
        if command -v deno >/dev/null 2>&1; then
          echo "Deno is already installed: $(deno --version)"
        else
          echo "Installing Deno..."
          curl -fsSL https://deno.land/install.sh | sh
          echo "Deno installed. Please add Deno to your PATH or restart your shell."
        fi

  frontend:install:
    desc: "Install frontend dependencies (npm + Deno cache)"
    dir: frontend
    cmds:
      - |
        echo "Installing frontend dependencies..."
        npm install --no-save
        if command -v deno >/dev/null 2>&1; then
          echo "Caching TypeScript files with Deno..."
          deno cache vite.config.ts svelte.config.js vitest.config.ts playwright.config.ts src/**/*.ts 2>/dev/null || true
          echo "Dependencies installed and cached."
        else
          echo "Dependencies installed (Deno not available for caching)."
        fi

  frontend:setup:
    desc: "Full frontend setup (install Deno + cache dependencies)"
    cmds:
      - echo "Setting up frontend..."
      - |
        if ! command -v deno >/dev/null 2>&1; then
          echo "Deno not found. Installing..."
          task install:deno || echo "Please install Deno manually: curl -fsSL https://deno.land/install.sh | sh"
        fi
      - task: frontend:install

  # Frontend
  frontend:dev:
    desc: "Run frontend dev server (Deno, fallback to npm)"
    dir: frontend
    cmds:
      - |
        if command -v deno >/dev/null 2>&1; then
          deno task dev
        else
          echo "deno not found, using npm"
          npm run dev
        fi

  frontend:build:
    desc: "Build frontend for production (Deno, fallback to npm)"
    dir: frontend
    cmds:
      - |
        if command -v deno >/dev/null 2>&1; then
          deno task build
        else
          echo "deno not found, using npm"
          npm run build
        fi

  frontend:test:
    desc: "Run frontend E2E tests (Playwright via Deno, fallback to npm)"
    dir: frontend
    cmds:
      - |
        if command -v deno >/dev/null 2>&1; then
          deno task test
        else
          npm test
        fi

  frontend:test:unit:
    desc: "Run frontend unit tests (Vitest via Deno, fallback to npm)"
    dir: frontend
    cmds:
      - |
        if command -v deno >/dev/null 2>&1; then
          deno task test:unit
        else
          npm run test:unit
        fi

  # Environment
  dev:up:
    desc: "Start development dependencies (docker-compose.dev.yml)"
    cmds:
      - docker compose -f docker-compose.dev.yml --env-file .env.local up -d

  dev:down:
    desc: "Stop development dependencies"
    cmds:
      - docker compose -f docker-compose.dev.yml --env-file .env.local down --remove-orphans

  dev:logs:
    desc: "Tail dependency logs"
    cmds:
      - docker compose -f docker-compose.dev.yml --env-file .env.local logs -f

  dev:config:
    desc: "Create .env.local from example if missing"
    cmds:
      - |
        if [ ! -f .env.local ]; then
          cp env.local.example .env.local
          echo "Created .env.local (edit with your settings)"
        else
          echo ".env.local already exists"
        fi



  docker:build:
    desc: "Build Docker image"
    cmds:
      - docker build -t caatsm-dashboard:latest .

  docker:up:
    desc: "Start docker-compose stack"
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: "Stop docker-compose stack"
    cmds:
      - docker compose down --remove-orphans

  clean:
    desc: "Remove build artifacts and caches"
    cmds:
      - rm -rf bin/ tmp/ .cache/go-build
      - rm -f coverage.out coverage.html
      - rm -rf frontend/.svelte-kit frontend/build frontend/.vite

  clean:all:
    desc: "Clean everything including dependencies"
    cmds:
      - task: clean
      - rm -rf node_modules frontend/node_modules
