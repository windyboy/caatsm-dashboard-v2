version: "3"

vars:
  GO_MODULE: github.com/windy/caatsm-dashboard

tasks:
  default:
    cmds:
      - task: build

  tidy:
    desc: "Run go mod tidy"
    cmds:
      - go mod tidy

  generate:
    desc: "Generate templ components"
    cmds:
      - go run github.com/a-h/templ/cmd/templ@v0.3.960 generate

  dev:
    desc: "Run API server with hot reload"
    deps: [generate]
    cmds:
      - air

  build:
    desc: "Build server binary"
    deps: [generate]
    cmds:
      - go build -o bin/caatsm ./cmd/server

  test:
    desc: "Run Go tests"
    cmds:
      - go test ./...

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  tailwind:
    desc: "Build Tailwind CSS"
    dir: assets
    cmds:
      - npx tailwindcss -i ./css/input.css -o ../public/css/app.css --watch

  tailwind:build:
    desc: "Build Tailwind CSS once"
    dir: assets
    cmds:
      - npx tailwindcss -i ./css/input.css -o ../public/css/app.css --minify

  docker:build:
    desc: "Build application container"
    cmds:
      - docker build -t caatsm-dashboard:latest .

  docker:up:
    desc: "Start docker-compose stack"
    cmds:
      - docker compose up --build

  docker:down:
    desc: "Stop docker-compose stack"
    cmds:
      - docker compose down --remove-orphans

  dev:up:
    desc: "Start development dependencies (Docker/Podman compatible)"
    cmds:
      - |
        # Start development dependencies with .env.local
        if command -v podman > /dev/null 2>&1 && ! command -v docker > /dev/null 2>&1; then
          podman compose -f docker-compose.dev.yml --env-file .env.local up -d
        else
          docker compose -f docker-compose.dev.yml --env-file .env.local up -d
        fi

  dev:down:
    desc: "Stop development dependencies"
    cmds:
      - |
        if command -v podman > /dev/null 2>&1 && ! command -v docker > /dev/null 2>&1; then
          podman compose -f docker-compose.dev.yml --env-file .env.local down --remove-orphans
        else
          docker compose -f docker-compose.dev.yml --env-file .env.local down --remove-orphans
        fi

  dev:logs:
    desc: "Show logs from development dependencies"
    cmds:
      - |
        if command -v podman > /dev/null 2>&1 && ! command -v docker > /dev/null 2>&1; then
          podman compose -f docker-compose.dev.yml --env-file .env.local logs -f
        else
          docker compose -f docker-compose.dev.yml --env-file .env.local logs -f
        fi

  dev:config:
    desc: "Setup local development configuration"
    cmds:
      - |
        if [ ! -f .env.local ]; then
          cp env.local.example .env.local
          echo "Created .env.local from env.local.example"
          echo "Please edit .env.local with your settings"
        else
          echo ".env.local already exists, skipping..."
        fi

  dev:run:
    desc: "Run application with local config file"
    deps: [generate]
    cmds:
      - go run ./cmd/server -config config/config.local.toml

  dev:meili-key:
    desc: "Extract Meilisearch master key from container logs"
    cmds:
      - |
        if command -v podman > /dev/null 2>&1 && ! command -v docker > /dev/null 2>&1; then
          podman compose -f docker-compose.dev.yml --env-file .env.local logs meilisearch 2>/dev/null | ./scripts/extract-meili-key.sh
        else
          docker compose -f docker-compose.dev.yml --env-file .env.local logs meilisearch 2>/dev/null | ./scripts/extract-meili-key.sh
        fi

